[workspace]
members = [
  "crates/altior-acp",
  "crates/altior-core",
  "crates/altior-crdt",
  "crates/altior-crypto",
  "crates/altior-domain",
  "crates/altior-ipc",
  "crates/altior-protocol",
  "crates/altior-relay",
  "crates/altior-storage",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

