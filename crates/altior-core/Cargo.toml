[package]
name = "altior-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
altior-acp = { path = "../altior-acp" }
altior-domain = { path = "../altior-domain" }
altior-ipc = { path = "../altior-ipc" }
altior-protocol = { path = "../altior-protocol" }
altior-storage = { path = "../altior-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "altior_core"
path = "src/lib.rs"

[[bin]]
name = "altior-core"
path = "src/main.rs"

